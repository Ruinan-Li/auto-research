[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-research"
version = "0.1.0"
description = "Industrial-grade autonomous deep research agent powered by claim-evidence extraction, tree search exploration, and MCP tooling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ruinan-Li"}
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
auto-research = "auto_research.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_research*"]
